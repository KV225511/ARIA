services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: aria
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria -d aria"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - aria-postgres:/var/lib/postgresql/data

volumes:
  aria-postgres:
