    <rect x="470" y="420" width="215" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="577" y="448" text-anchor="middle" class="box-title">Preflight + Pair Plan</text>
    <text x="577" y="472" text-anchor="middle" class="box-text">32 components: 20 / 6 / 6</text>
    <text x="577" y="493" text-anchor="middle" class="box-text">30% no-evidence overlap</text>

    <rect x="730" y="420" width="215" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="837" y="448" text-anchor="middle" class="box-title">LLM Simulator v8</text>
    <text x="837" y="472" text-anchor="middle" class="box-text">Qwen2.5 7B candidate</text>
    <text x="837" y="493" text-anchor="middle" class="box-text">Gemma 3 4B evaluator</text>

    <rect x="990" y="420" width="220" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="1100" y="448" text-anchor="middle" class="box-title">M7 Environment</text>
    <text x="1100" y="472" text-anchor="middle" class="box-text">8 actions + masks</text>
    <text x="1100" y="493" text-anchor="middle" class="box-text">behavior policy v2</text>

    <rect x="1255" y="420" width="245" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="1377" y="448" text-anchor="middle" class="box-title">Versioned Raw Evidence</text>
    <text x="1377" y="472" text-anchor="middle" class="box-text">transition v4 + manifests</text>
    <text x="1377" y="493" text-anchor="middle" class="box-text">backups + failed-run partials</text>

    <rect x="350" y="570" width="215" height="95" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="457" y="598" text-anchor="middle" class="box-title">Quality Gates</text>
    <text x="457" y="622" text-anchor="middle" class="box-text">raw + distribution audit</text>
    <text x="457" y="643" text-anchor="middle" class="box-text">provenance + leakage</text>

    <rect x="630" y="570" width="215" height="95" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="737" y="598" text-anchor="middle" class="box-title">Identity-safe Split</text>
    <text x="737" y="622" text-anchor="middle" class="box-text">train · validation · test</text>
    <text x="737" y="643" text-anchor="middle" class="box-text">connected components</text>

    <rect x="910" y="570" width="230" height="95" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="1025" y="598" text-anchor="middle" class="box-title">M6 Calibration + Replay</text>
    <text x="1025" y="622" text-anchor="middle" class="box-text">belief config · state v4</text>
    <text x="1025" y="643" text-anchor="middle" class="box-text">reward v3</text>

    <rect x="1205" y="570" width="245" height="95" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="1327" y="598" text-anchor="middle" class="box-title">Custom PyTorch IQL</text>
    <text x="1327" y="622" text-anchor="middle" class="box-text">validation selection</text>
    <text x="1327" y="643" text-anchor="middle" class="box-text">locked belief test + rollout gate</text>
  </g>
  <path d="M425 470 H470" class="arrow"/>
  <path d="M685 470 H730" class="arrow"/>
  <path d="M945 470 H990" class="arrow"/>
  <path d="M1210 470 H1255" class="arrow"/>
  <path d="M1377 520 V545 H457 V570" class="arrow"/>
  <path d="M565 617 H630" class="arrow"/>
  <path d="M845 617 H910" class="arrow"/>
  <path d="M1140 617 H1205" class="arrow"/>

  <!-- TARGET PLANE -->
  <rect x="35" y="730" width="1530" height="305" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="770" class="lane-title" fill="#6d28d9">TARGET</text>
  <text x="60" y="795" class="lane-title" fill="#6d28d9">INTEGRATION</text>
  <text x="60" y="821" class="lane-sub" fill="#6d28d9">implemented modules;</text>
  <text x="60" y="840" class="lane-sub" fill="#6d28d9">dashed = not wired</text>

  <g>
    <rect x="220" y="785" width="225" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
