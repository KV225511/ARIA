<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">ARIA system architecture</title>
  <desc id="desc">Status-aware diagram separating the current live web application, the implemented offline evidence and reinforcement-learning pipeline, and the intended full multimodal integration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 22px 'Segoe UI', Arial, sans-serif; }
      .lane-sub { font: 500 13px 'Segoe UI', Arial, sans-serif; }
      .box-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #991b1b; }
      .contract { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .planned { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #15803d; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f8fafc"/>
  <text x="550" y="48" text-anchor="middle" class="title">ARIA — Status-Aware System Architecture</text>
  <text x="550" y="76" text-anchor="middle" class="subtitle">Current live application · validated offline RL pipeline · intended multimodal integration</text>

  <g transform="translate(1110,28)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="26" y="14" class="box-text">Live</text>
    <rect x="90" y="0" width="18" height="18" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="116" y="14" class="box-text">Offline</text>
    <rect x="200" y="0" width="18" height="18" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="226" y="14" class="box-text">Planned connection</text>
  </g>

  <!-- LIVE PLANE -->
  <rect x="35" y="105" width="1530" height="245" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="145" class="lane-title" fill="#1d4ed8">CURRENT LIVE</text>
  <text x="60" y="168" class="lane-sub" fill="#1e40af">app.py + frontend</text>

  <g>
    <rect x="220" y="145" width="225" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="332" y="174" text-anchor="middle" class="box-title">Candidate UI</text>
    <text x="332" y="198" text-anchor="middle" class="box-text">React 19 + Vite</text>
    <text x="332" y="219" text-anchor="middle" class="box-text">PDFs · text · WebM audio</text>
    <text x="332" y="240" text-anchor="middle" class="box-text">local camera preview</text>

    <rect x="505" y="145" width="235" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="622" y="174" text-anchor="middle" class="box-title">FastAPI Orchestrator</text>
    <text x="622" y="198" text-anchor="middle" class="box-text">HTTP session + WebSocket</text>
    <text x="622" y="219" text-anchor="middle" class="box-text">PyMuPDF · ffmpeg</text>
    <text x="622" y="240" text-anchor="middle" class="box-text">M1 faster-whisper STT</text>

    <rect x="800" y="145" width="230" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="915" y="174" text-anchor="middle" class="box-title">M5 + M6</text>
    <text x="915" y="198" text-anchor="middle" class="box-text">grounded ontology</text>
    <text x="915" y="219" text-anchor="middle" class="box-text">belief state</text>
    <text x="915" y="240" text-anchor="middle" class="box-text">role/JD/resume evidence</text>

    <rect x="1090" y="145" width="225" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="1202" y="174" text-anchor="middle" class="box-title">M8 Question Generator</text>
    <text x="1202" y="198" text-anchor="middle" class="box-text">Ollama streaming</text>
    <text x="1202" y="219" text-anchor="middle" class="box-text">grounding validation</text>
    <text x="1202" y="240" text-anchor="middle" class="box-text">up to 3 attempts</text>

    <rect x="1370" y="145" width="160" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="1450" y="174" text-anchor="middle" class="box-title">Delivery</text>
    <text x="1450" y="198" text-anchor="middle" class="box-text">WebSocket text</text>
    <text x="1450" y="219" text-anchor="middle" class="box-text">browser TTS</text>
  </g>
  <path d="M445 197 H505" class="arrow"/>
  <path d="M740 197 H800" class="arrow"/>
  <path d="M1030 197 H1090" class="arrow"/>
  <path d="M1315 197 H1370" class="arrow"/>
  <path d="M1450 250 V285 H332 V250" class="arrow"/>
  <rect x="400" y="297" width="860" height="34" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="830" y="319" text-anchor="middle" class="note">Current limitation: fixed 3-action cycle + placeholder 0.9 evidence; no live IQL, vision, prosody, fusion, or final report</text>

  <!-- OFFLINE PLANE -->
  <rect x="35" y="375" width="1530" height="330" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="60" y="415" class="lane-title" fill="#9a3412">IMPLEMENTED</text>
  <text x="60" y="440" class="lane-title" fill="#9a3412">OFFLINE</text>
  <text x="60" y="466" class="lane-sub" fill="#9a3412">generation · replay</text>
  <text x="60" y="485" class="lane-sub" fill="#9a3412">training · audits</text>

  <g>
    <rect x="220" y="420" width="205" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
