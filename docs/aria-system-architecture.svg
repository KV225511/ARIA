    <text x="332" y="837" text-anchor="middle" class="box-text">text/semantic · vision</text>
    <text x="332" y="858" text-anchor="middle" class="box-text">prosody + baselines</text>
    <text x="332" y="879" text-anchor="middle" class="box-text">audio/video response</text>

    <rect x="500" y="785" width="220" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="610" y="813" text-anchor="middle" class="box-title">M4 Fusion</text>
    <text x="610" y="837" text-anchor="middle" class="box-text">normalization + missing data</text>
    <text x="610" y="858" text-anchor="middle" class="box-text">attention / concat baseline</text>
    <text x="610" y="879" text-anchor="middle" class="box-text">72-feature vector</text>

    <rect x="775" y="785" width="230" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="890" y="813" text-anchor="middle" class="box-title">M10–M12 Analysis</text>
    <text x="890" y="837" text-anchor="middle" class="box-text">cognitive load</text>
    <text x="890" y="858" text-anchor="middle" class="box-text">integrity + incongruence</text>
    <text x="890" y="879" text-anchor="middle" class="box-text">confidence-aware evidence</text>

    <rect x="1060" y="785" width="220" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1170" y="813" text-anchor="middle" class="box-title">M5–M8 Control</text>
    <text x="1170" y="837" text-anchor="middle" class="box-text">ontology + calibrated belief</text>
    <text x="1170" y="858" text-anchor="middle" class="box-text">loaded IQL policy</text>
    <text x="1170" y="879" text-anchor="middle" class="box-text">grounded question</text>

    <rect x="1335" y="785" width="190" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1430" y="813" text-anchor="middle" class="box-title">M9 Interaction</text>
    <text x="1430" y="837" text-anchor="middle" class="box-text">speech delivery</text>
    <text x="1430" y="858" text-anchor="middle" class="box-text">avatar interface</text>
    <text x="1430" y="879" text-anchor="middle" class="box-text">next turn</text>

    <rect x="500" y="935" width="245" height="68" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="622" y="963" text-anchor="middle" class="box-title">M13 Fairness Audit</text>
    <text x="622" y="985" text-anchor="middle" class="box-text">trajectory treatment monitoring</text>

    <rect x="815" y="935" width="245" height="68" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="937" y="963" text-anchor="middle" class="box-title">M14 Evaluation</text>
    <text x="937" y="985" text-anchor="middle" class="box-text">report + human review</text>

    <rect x="1130" y="935" width="260" height="68" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="1260" y="963" text-anchor="middle" class="box-title">M15 Feedback Log</text>
    <text x="1260" y="985" text-anchor="middle" class="box-text">SQLite outcome capture</text>
  </g>
  <path d="M445 837 H500" class="planned"/>
  <path d="M720 837 H775" class="planned"/>
  <path d="M1005 837 H1060" class="planned"/>
  <path d="M1280 837 H1335" class="planned"/>
  <path d="M1430 890 V915 H332 V890" class="planned"/>
