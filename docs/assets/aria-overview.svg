<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="884" viewBox="0 0 1440 884" role="img" aria-labelledby="title desc">
<title id="title">ARIA application and offline learning architecture</title>
<desc id="desc">The live React workspace communicates with FastAPI and local model services, backed by Google OIDC, PostgreSQL, private PDF storage, and background jobs. A separate offline pipeline performs evidence auditing, belief calibration, replay, and IQL training. Live scoring and policy integration remain in progress.</desc>
