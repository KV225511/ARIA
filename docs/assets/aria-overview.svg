<text x="64" y="117.02" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600" fill="#f0f5fc">From source documents to interview state.</text>
<text x="64" y="161.82" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#abbcd1">A live application backed by a separate, reproducible learning pipeline.</text>
